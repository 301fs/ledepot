# ============================================================================
# CAMPAIGN PROFILE — the one file you edit to change a campaign.
# Copy _template.yaml to start a new one. See README.md for the full schema.
#
# This campaign: nail & hair salons in the NYC tri-state with weak/no websites,
# offered a website build.
# ============================================================================

name: salons-tristate-website
description: Nail & hair salons (NY/NJ/CT) with no or weak websites — offer a modern, mobile-friendly site with online booking.
offer: website          # which need-signal detector set the qualifier uses (see README)

# --- SOURCING (read by lead-scraper) ---------------------------------------
sourcing:
  provider: outscraper        # outscraper | apify
  niches:                     # each niche is combined with each location below
    - nail salon
    - hair salon
  locations:                  # tri-state towns/cities to sweep
    - Hoboken NJ
    - Jersey City NJ
    - Newark NJ
    - Paramus NJ
    - White Plains NY
    - New Rochelle NY
    - Yonkers NY
    - Stamford CT
    - Norwalk CT
    - Greenwich CT
  limit_per_query: 50         # max places per "<niche> in <location>" query
  language: en
  region: US
  enrich_emails: true         # ask the provider to also pull emails (small add-on cost)

# --- OFFER framing (used in outreach + to explain the pitch) ----------------
pitch: "A modern, mobile-friendly website with online booking so clients can book without calling."

# --- QUALIFICATION (read by lead-qualifier) --------------------------------
# Composite = (need * w_need) x (ability * w_ability) x (reach * w_reach).
# Multiply, not add: a near-zero on any dimension kills the lead on purpose.
qualification:

  # NEED — points per signal id. The detector for each id is defined in code
  # for this offer (see lead-qualifier). Highest-scoring firing signal wins.
  need_points:
    no_website: 10            # only a Google listing, no site
    social_only: 9            # Facebook/Instagram but no real website
    no_https: 8               # http:// only, no SSL
    builder_subdomain: 7      # wixsite.com / business.site / weebly etc.
    site_exists_unverified: 5 # a site exists; load it before trusting tier
    modern_site: 1            # functional modern site -> low need

  # ABILITY to pay — proof of steady customers.
  ability:
    review_buckets:           # [min_review_count, points]; highest matching bucket wins
      - [0, 0]
      - [1, 3]
      - [10, 6]
      - [50, 8]
      - [200, 10]
    rating_full_at: 4.0       # rating >= this -> full multiplier
    rating_mid_at: 3.0        # rating >= this (but < full) -> mid multiplier
    rating_full_mult: 1.0
    rating_mid_mult: 0.85
    rating_low_mult: 0.7      # below mid, or unrated
    price_bump_levels: ["$$", "$$$", "$$$$"]
    price_bump: 1             # +points if price level is in the list above

  # REACH — can the demo-email-then-call motion run?
  reach:
    email_phone_owner: 10
    email_phone: 9
    email_only: 7
    phone_only: 6
    none: 0

  # TIERS — evaluated top to bottom; first match wins.
  tiers:
    disqualify_max_need: 2    # need <= this => already has a modern site => skip
    A: { min_need: 7, min_ability: 6, requires_email: true }   # hot: demo + email first
    B: { min_need: 7, min_ability: 6, requires_email: false }  # warm: phone-first
    C: { min_composite: 30 }                                    # nurture
    # anything else => Disqualified

  weights:
    need: 1.0
    ability: 1.0
    reach: 1.0
